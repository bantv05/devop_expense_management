name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build and run backend tests
        run: |
          cd BE_QLChiTieu/qly_chi_tieu
          chmod +x ./gradlew
          ./gradlew clean test --no-daemon

      - name: Build backend artifact
        run: |
          cd BE_QLChiTieu/qly_chi_tieu
          ./gradlew bootJar --no-daemon

  frontend:
    name: Frontend Install and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install frontend dependencies
        run: |
          cd FE_QLChiTieu/qlct_fe
          npm install

      - name: Build frontend
        run: |
          cd FE_QLChiTieu/qlct_fe
          npm run build

  docker-build:
    name: Docker Build Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: |
          docker build -t expense-backend:ci BE_QLChiTieu/qly_chi_tieu

      - name: Build frontend Docker image
        run: |
          docker build -t expense-frontend:ci FE_QLChiTieu/qlct_fe

  docker-publish:
    name: Publish Docker Images (optional)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag backend image
        run: |
          docker tag expense-backend:ci ${{ secrets.DOCKERHUB_USERNAME }}/expense-backend:latest
          docker tag expense-frontend:ci ${{ secrets.DOCKERHUB_USERNAME }}/expense-frontend:latest

      - name: Push backend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/expense-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/expense-frontend:latest
